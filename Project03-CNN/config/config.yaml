# main project settings - deep learning exercise 3

# data paths (relative from project root)
data:
  dataset1_images:  "data/dataset1/images"
  dataset1_masks:   "data/dataset1/masks"
  dataset1_csv:     "data/dataset1/Labels and Colors.csv"
  dataset2_dir:     "data/dataset2/images"

  val_split: 0.1        # 10 percent for validation
  image_size: 256       # input size to model (256x256)
  num_workers: 4        # set to 0 for Windows (avoid multiprocessing issues)

  # quick test settings (set enabled: true for debugging)
  quick_test:
    enabled: true       # change to true for quick test
    num_train_samples: 90
    num_val_samples: 10

# unified classes
classes:
  names:
    - Background      # 0
    - Field           # 1
    - Player          # 2
    - Goalkeeper      # 3
    - Referee         # 4
    - Ball            # 5
    - Goal Bar        # 6
    - Advertisement   # 7
    - Audience        # 8
    - Staff           # 9
  num_classes: 10

# color to unified class mapping for dataset1
# based on CSV file: Labels and Colors.csv
dataset1_color_to_unified:
  "[237, 34, 236]": 7      # Advertisement
  "[201, 158, 74]": 1      # Field
  "[96, 32, 192]": 5       # Football (Ball)
  "[89, 134, 179]": 6      # Goal Bar
  "[153, 223, 219]": 3     # Goalkeeper 1
  "[255, 106, 77]": 3      # Goalkeeper 2
  "[22, 100, 252]": 4      # Referee
  "[143, 182, 45]": 8      # Spectators (Audience)
  "[38, 198, 129]": 2      # Team 1 (Player)
  "[27, 154, 218]": 2      # Team 2 (Player)
  "[0, 0, 0]": 0           # Background

# color to unified class mapping for dataset2
# based on manual inspection of actual mask colors
dataset2_color_to_unified:
  "[0, 0, 0]": 0          # Background
  "[27, 71, 151]": 7      # Advertisement
  "[111, 48, 253]": 8     # Audience
  "[137, 126, 126]": 1    # Field
  "[201, 19, 223]": 5     # Ball
  "[238, 171, 171]": 4    # Referee
  "[254, 233, 3]": 2      # Player (black team)
  "[255, 0, 29]": 6       # Goal Bar
  "[255, 159, 0]": 3      # Goalkeeper (red team)
  "[255, 160, 1]": 2      # Player (red team)
  "[255, 235, 0]": 3      # Goalkeeper (black team)

# model settings
model:
  encoder_channels: [64, 128, 256, 512]   # encoder channels for each stage
  # upsample_mode: one of these two options
  #   "bilinear"   -> Upsample(bilinear) + Conv(3x3)
  #   "transposed" -> ConvTranspose2d(stride=2)
  upsample_mode: "transposed"   # use transposed for best results
  # skip_connections: connections between encoder and decoder
  skip_connections: true
  # use_batch_norm: add BatchNorm after each Conv layer (Conv -> BN -> ReLU)
  use_batch_norm: true         # set to true for question 1-6 (BatchNorm experiment)

# training settings
training:
  epochs: 30
  batch_size: 8
  learning_rate: 0.001
  optimizer: "adam"
  loss: "cross_entropy"          # cross_entropy or focal (for question 1-7)

  device: "cuda"         # cuda for GPU, cpu for CPU
  save_best_model: true
  checkpoint_path: "models/saved_models/best_model.pth"

# class weights for weighted cross entropy
# inverse-frequency weights based on distribution analysis (section 1-2)
# Staff (class 9) weight=0 because it has no samples
class_weights: Null       # Null for regular CE, uncomment list to use Weighted CE

# focal loss settings (for question 1-7)
focal_loss:
  gamma: 2.0
  alpha: null              # null means same weight for all classes

# evaluation settings
evaluation:
  metric: "mIoU"
  num_vis_samples: 5       # number of samples for visualization